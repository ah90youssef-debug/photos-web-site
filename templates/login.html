<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>تسجيل دخول المسؤول - سجل المدرسين</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>تسجيل دخول المسؤول 🔒</h2>
        <p class="subtitle">أدخل كلمة المرور لإدارة وحذف السجلات</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flashes">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">اسم المستخدم:</label>
                <input type="text" id="username" name="username" value="admin" required autofocus>
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="btn btn-primary full-width" style="margin-top: 18px;">دخول</button>
            <a href="/" class="btn btn-secondary full-width" style="margin-top: 10px;">العودة للرئيسية</a>
        </form>
    </div>
</body>
</html>
